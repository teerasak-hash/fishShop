<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fish Shop Admin</title><link rel="stylesheet" href="/styles.css"></head><body><main><div class="section-head"><div><p class="eyebrow">ADMIN</p><h2>จัดการคำสั่งซื้อ</h2></div><a class="btn secondary" href="/">กลับหน้าร้าน</a></div><div id="orders"><p>กำลังโหลด...</p></div></main><script>fetch('/api/orders').then(r=>r.json()).then(xs=>document.querySelector('#orders').innerHTML=xs.map(x=>'<div class="card" style="padding:18px;margin:10px 0"><b>#'+x.id+' '+x.customerName+'</b><p>'+x.phone+' · '+x.address+'</p><strong>฿'+Number(x.total).toLocaleString('th-TH',{minimumFractionDigits:2})+'</strong><p>'+new Date(x.createdAt).toLocaleString('th-TH')+'</p></div>').join('')||'<p>ยังไม่มีคำสั่งซื้อ</p>').catch(()=>document.querySelector('#orders').innerHTML='<p>ไม่สามารถโหลดคำสั่งซื้อได้</p>');</script></body></html>
